name: Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS app and pkg
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Import Apple signing certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/pagemint-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pagemint-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
      - name: Build macOS app package
        run: apps/offline-converter/connectors/macos/build-app-pkg.sh dist/macos-app
      - name: Package macOS app zip
        run: |
          cd dist/macos-app
          ditto -c -k --sequesterRsrc --keepParent "PageMint Offline.app" PageMintOffline-macOS-app.zip
          shasum -a 256 PageMintOfflineApp.pkg PageMintOffline-macOS-app.zip > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PageMintOffline-macOS
          path: |
            dist/macos-app/PageMintOfflineApp.pkg
            dist/macos-app/PageMintOffline-macOS-app.zip
            dist/macos-app/SHA256SUMS-macOS.txt

  build-windows:
    name: Windows app and connector
    runs-on: windows-2022
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Windows app
        shell: pwsh
        run: apps/offline-converter/connectors/windows/build-app-exe.ps1 -OutputDir dist\windows-app
      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "pagemint-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "pagemint-cert-thumbprint.txt") -Value $cert.Thumbprint
      - name: Sign Windows app
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $thumbprint = Get-Content (Join-Path $env:RUNNER_TEMP "pagemint-cert-thumbprint.txt")
          $cert = Get-ChildItem Cert:\CurrentUser\My\$thumbprint
          Set-AuthenticodeSignature -FilePath "dist\windows-app\PageMint Offline.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
      - name: Build Windows connector
        shell: pwsh
        run: apps/offline-converter/connectors/windows/build-exe.ps1 -OutputDir dist\windows-connector
      - name: Sign Windows connector
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $thumbprint = Get-Content (Join-Path $env:RUNNER_TEMP "pagemint-cert-thumbprint.txt")
          $cert = Get-ChildItem Cert:\CurrentUser\My\$thumbprint
          Set-AuthenticodeSignature -FilePath "dist\windows-connector\PageMintConnector.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" apps\offline-converter\connectors\windows\PageMintOffline.iss
      - name: Sign Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $thumbprint = Get-Content (Join-Path $env:RUNNER_TEMP "pagemint-cert-thumbprint.txt")
          $cert = Get-ChildItem Cert:\CurrentUser\My\$thumbprint
          Set-AuthenticodeSignature -FilePath "dist\windows-installer\PageMintOfflineSetup.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
      - name: Package Windows artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\windows-app\PageMint Offline.exe" -DestinationPath "dist\windows-app\PageMintOffline-Windows-app.zip" -Force
          Compress-Archive -Path "dist\windows-connector\PageMintConnector.exe" -DestinationPath "dist\windows-connector\PageMintConnector-Windows.zip" -Force
          Get-FileHash "dist\windows-installer\PageMintOfflineSetup.exe", "dist\windows-app\PageMintOffline-Windows-app.zip", "dist\windows-connector\PageMintConnector-Windows.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path "dist\SHA256SUMS-Windows.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PageMintOffline-Windows
          path: |
            dist/windows-installer/PageMintOfflineSetup.exe
            dist/windows-app/PageMintOffline-Windows-app.zip
            dist/windows-connector/PageMintConnector-Windows.zip
            dist/SHA256SUMS-Windows.txt

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/*
          body: |
            PageMint Offline desktop installers.

            These artifacts are unsigned unless a later release note explicitly says otherwise.
            macOS Gatekeeper and Windows SmartScreen may warn users for unsigned builds.
